version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. Main Web Application (AI-PDF-to-MD Converter)
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jirayusgoodlife/ai-pdf-to-md:latest
    container_name: ai-pdf-to-md-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
    environment:
      # Pointing to internal ollama service by default
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_ENABLED=${LLM_ENABLED}
      - DEFAULT_ENGINE=${DEFAULT_ENGINE}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB}
    # depends_on:
    #   - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

